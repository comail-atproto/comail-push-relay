version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  schedule:
    interval: weekly
    day: tuesday
    time: "04:00"
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - automated
  commit-message:
    prefix: chore
    include: scope
  groups:
    security-patches:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - patch
    compatible-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - patch
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: weekly
    day: tuesday
    time: "04:00"
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - automated
  commit-message:
    prefix: chore
    include: scope
  groups:
    security-patches:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - patch
    compatible-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - patch
