name: Check contribution policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: contribution-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: contribution-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test review media policy
        run: python3 -B scripts/test_review_media.py
      - name: Reject committed review evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-review-media.py "$BASE_SHA" "$HEAD_SHA"
      - name: Test native stack policy
        run: bash scripts/check-pr-stack-policy-test.sh
      - name: Verify native stack membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pr-stack-policy.sh
