name: Check contribution policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: contribution-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: contribution-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: comail-atproto/ci/actions/contribution-policy@v1
        with:
          token: ${{ github.token }}
