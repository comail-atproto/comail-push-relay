name: Test dependency merge policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    name: dependency-merge-policy
    runs-on: ${{ github.event.repository.private && 'comail-big-nix-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: comail-atproto/ci/actions/check-dependency-policy@v1
