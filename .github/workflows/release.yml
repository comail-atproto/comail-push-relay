name: Test and publish push relay
on:
  pull_request:
  push:
    branches: [main, 'source/**']
permissions:
  contents: read
jobs:
  build:
    name: Build and test push relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Test dependency safeguards
        run: python3 -B -m unittest scripts.test_dependency_merge
      - name: Run the test suite
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Scan committed source for secrets
        uses: trufflesecurity/trufflehog@4b8eb0e1e1052263d28bbfde7b4d3cb64a354aab
        with:
          version: 3.97.8@sha256:7fa530fec5e9e36b77b42117b319c677ab3e6eb50c979362748686a5d17185fe
      - name: Package the tested push relay
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p .release/dist
          cp -a dist/. .release/dist/
          cp -a node_modules package.json .release/dist/
          printf '{"app":"push-relay","source_sha":"%s"}\n' "$GITHUB_SHA" > .release/release.json
          tar -C .release --exclude=dist/node_modules/.bin -czf release.tar.gz release.json dist
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: push-relay-release
          path: |
            release.tar.gz
            release.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tested push relay release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: push-relay-release
      - name: Choose the next release version
        id: version
        run: |
          version="$(python3 scripts/release-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write the release checksum
        if: steps.version.outputs.version != ''
        run: sha256sum release.tar.gz > release.sha256
      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$VERSION"
          --target "$GITHUB_SHA" --prerelease --generate-notes
          release.tar.gz release.sha256

  ci:
    name: ci
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful push relay tests
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
