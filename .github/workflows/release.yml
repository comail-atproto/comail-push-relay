name: Test, publish and deploy push relay
on:
  pull_request:
  push:
    branches: [main, 'source/**']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback]
        required: true
      version:
        description: Release tag (vX.Y.Z) or, for rollback, a retained release name
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    name: Build and test push relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Test dependency safeguards
        run: python3 -B -m unittest scripts.test_dependency_merge
      - name: Run the test suite
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Scan committed source for secrets
        uses: trufflesecurity/trufflehog@4b8eb0e1e1052263d28bbfde7b4d3cb64a354aab
        with:
          version: 3.97.8@sha256:7fa530fec5e9e36b77b42117b319c677ab3e6eb50c979362748686a5d17185fe
      - name: Package the tested push relay
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          mkdir -p .release/dist
          cp -a dist/. .release/dist/
          cp -a node_modules package.json .release/dist/
          printf '{"app":"push-relay","source_sha":"%s"}\n' "$GITHUB_SHA" > .release/release.json
          tar -C .release --exclude=dist/node_modules/.bin -czf release.tar.gz release.json dist
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: push-relay-release
          path: |
            release.tar.gz
            release.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tested push relay release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release-notes.outputs.tag-name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: push-relay-release
      - name: Publish release notes
        id: release-notes
        uses: comail-atproto/ci/actions/release-notes@v1
        with:
          app-client-id: ${{ vars.COMAIL_AGENTS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.COMAIL_AGENTS_APP_PRIVATE_KEY }}
          bootstrap-sha: 4f137fdd5971ea5c53cf49575d4a145b44a3a68e
      - name: Attest the tested release archive
        if: steps.release-notes.outputs.tag-name != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release.tar.gz
      - name: Publish the tested release archive
        if: steps.release-notes.outputs.tag-name != ''
        uses: comail-atproto/ci/actions/publish-release@v1
        with:
          version: ${{ steps.release-notes.outputs.tag-name }}
          archive: release.tar.gz
          token: ${{ github.token }}

  deploy:
    name: Deploy push relay to production
    needs: release
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.version != '' &&
        vars.COMAIL_ORG_DEPLOY_PRODUCTION_ENABLED == 'true' && vars.COMAIL_DEPLOY_PRODUCTION_ENABLED == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    environment: production
    concurrency:
      group: push-relay-production
      cancel-in-progress: false
    steps:
      # The host installer checks Push Relay's health and restores the previous release if it fails.
      - name: Deploy the selected version
        uses: comail-atproto/ci/actions/deploy-release@v1
        with:
          operation: ${{ inputs.action || 'deploy' }}
          version: ${{ inputs.version || needs.release.outputs.version }}
          token: ${{ github.token }}
          ssh-key: ${{ secrets.COMAIL_DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.COMAIL_DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.COMAIL_DEPLOY_HOST }}
          user: comail-push-relay-deploy
          tailscale-client-id: ${{ secrets.COMAIL_DEPLOY_TS_CLIENT_ID }}
          tailscale-client-secret: ${{ secrets.COMAIL_DEPLOY_TS_CLIENT_SECRET }}

  ci:
    name: ci
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful push relay tests
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
