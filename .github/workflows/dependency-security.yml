name: Scan dependencies
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove stale scan results
        run: rm -f .osv-results.json
      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --output=.osv-results.json
            --format=json
            -r
            ./
        continue-on-error: true
      # A failed scan or missing lockfile must not become a clean report.
      - name: Require a completed scan
        run: test -s .osv-results.json
      - name: Reject vulnerable dependencies
        uses: google/osv-scanner-action/osv-reporter-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --output=.osv-results.sarif
            --new=.osv-results.json
            --gh-annotations=false
            --fail-on-vuln=true
  result:
    name: dependency-security
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require a completed clean scan
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: test "$SCAN_RESULT" = success
