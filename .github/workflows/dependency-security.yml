name: Scan dependencies
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: comail-atproto/ci/actions/scan-dependencies@v1
        with:
          install-nix: 'true'
  result:
    name: dependency-security
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require a completed clean scan
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: test "$SCAN_RESULT" = success
