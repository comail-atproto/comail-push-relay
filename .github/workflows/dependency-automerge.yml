name: Auto-merge tested dependency updates
on:
  # Use trusted main metadata only; never execute PR code here.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_run:
    workflows: ["Check contribution policy", "Review dependency changes", "Scan dependencies", "Test and deploy push relay"]
    types: [completed]
    branches: ["dependabot/**"]
permissions:
  contents: read
jobs:
  approve:
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    environment: dependency-automation
    if: >-
      github.event_name == 'pull_request_target' &&
      vars.COMAIL_DEPENDENCY_AUTOMERGE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.commits == 1 &&
      github.event.pull_request.user.id == 49699333 &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'human')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: comail-atproto/ci/actions/approve-dependency@v1
        id: policy
        with:
          token: ${{ github.token }}

  merge:
    needs: approve
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      vars.COMAIL_DEPENDENCY_AUTOMERGE_ENABLED == 'true' &&
      ((github.event_name == 'pull_request_target' && needs.approve.outputs.allowed == 'true') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: dependency-automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: comail-atproto/ci/actions/merge-dependency@v1
        with:
          token: ${{ github.token }}
          app-client-id: ${{ vars.COMAIL_DEPENDENCY_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.COMAIL_DEPENDENCY_APP_PRIVATE_KEY }}
